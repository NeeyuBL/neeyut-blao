name: Build & Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            package_script: package:win
            artifact_name: release-windows
            artifact_paths: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - name: macOS ARM64
            os: macos-15
            package_script: package:mac
            artifact_name: release-macos-arm64
            artifact_paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata and tag
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        # Rehearsal thủ công vẫn chạy tiếp để kiểm toolchain/build. Với tag thật,
        # thiếu credential là lỗi chặn và không có artifact nào được phát hành.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing macOS release secrets: ${missing[*]}"
            exit 1
          fi
          test "$(uname -m)" = "arm64"

      - name: Verify downloadable macOS ARM64 toolchain
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          asset_base="https://github.com/NeeyuBL/neeyut-blao/releases/download/assets-v1"
          curl_args=(--fail --location --retry 4 --retry-all-errors --header "Authorization: Bearer $GH_TOKEN")

          curl "${curl_args[@]}" "$asset_base/dy-engine-macos" -o "$work/dy-engine-macos"
          curl "${curl_args[@]}" "$asset_base/whisper-engine-macos.zip" -o "$work/whisper.zip"
          curl "${curl_args[@]}" "$asset_base/ocr-engine-macos.zip" -o "$work/ocr.zip"
          unzip -q "$work/whisper.zip" -d "$work/whisper"
          unzip -q "$work/ocr.zip" -d "$work/ocr"

          file "$work/dy-engine-macos" | grep -q arm64
          file "$(find "$work/whisper" -type f -name whisper-engine -print -quit)" | grep -q arm64
          file "$(find "$work/ocr" -type f -name ocr-engine -print -quit)" | grep -q arm64

          ffmpeg_base="https://ffmpeg.martin-riedl.de/download/macos/arm64/1785863997_9.0"
          curl --fail --location --retry 4 --retry-all-errors "$ffmpeg_base/ffmpeg.zip" -o "$work/ffmpeg.zip"
          curl --fail --location --retry 4 --retry-all-errors "$ffmpeg_base/ffprobe.zip" -o "$work/ffprobe.zip"
          echo "5267ef149ee0d208057a1b316aac079b661b0476574dee5da7d225769773c603  $work/ffmpeg.zip" | shasum -a 256 --check
          echo "7778fbb533fb60d3336cbd9a9e51eced71658f020b570c7203590c1c41d42f50  $work/ffprobe.zip" | shasum -a 256 --check
          unzip -q "$work/ffmpeg.zip" -d "$work/ffmpeg"
          ffmpeg_bin="$(find "$work/ffmpeg" -type f -name ffmpeg -print -quit)"
          chmod +x "$ffmpeg_bin"
          file "$ffmpeg_bin" | grep -q arm64
          "$ffmpeg_bin" -hide_banner -filters 2>&1 | grep -q ' subtitles '
          "$ffmpeg_bin" -hide_banner -decoders 2>&1 | grep -q dav1d
          "$ffmpeg_bin" -hide_banner -encoders 2>&1 | grep -q libx264

      - name: Prepare and verify bundled fonts
        run: npm run fonts:prepare && npm run fonts:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Test subtitle engine
        run: npm run test:subtitles

      - name: Build and package Windows app
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.package_script }}

      - name: Build, sign and notarize macOS ARM64 app
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        run: npm run ${{ matrix.package_script }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build unsigned macOS ARM64 rehearsal
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        run: npm run ${{ matrix.package_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify signed and notarized macOS ARM64 app
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'T-blao.app' -print -quit)"
          test -n "$app_path"
          lipo -archs "$app_path/Contents/MacOS/T-blao" | grep -qw arm64
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify rehearsal macOS architecture
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'T-blao.app' -print -quit)"
          test -n "$app_path"
          lipo -archs "$app_path/Contents/MacOS/T-blao" | grep -qw arm64

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install release verification dependency
        run: npm ci --ignore-scripts

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify update payloads
        run: node scripts/verify-release-assets.mjs release-assets

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: T-blao ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
